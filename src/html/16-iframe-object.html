<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iframe, object 요소 | Likelion Bootcamp</title>
  </head>
  <body>
    <a href="/index.html">Index로 이동</a>
    <hr />
    <h1>iframe, object 요소</h1>

    <figure>
      <iframe width="560" height="315" src="https://www.youtube.com/embed/W6VSA3GDK6s?si=eYiIoVRhkpOCyPKP" title="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <figcaption>WAI-ARIA 소개 유튜브 영상</figcaption>
    </figure>

    <iframe
      src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d21802.816762669674!2d126.87681506249461!3d37.47202902669525!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sko!2skr!4v1764221518227!5m2!1sko!2skr"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>

    <!-- PDF -->
    <figure>
      <object width="800" height="600" data="/src/assets/pdf/naver-coding-convention.pdf" type="application/pdf"></object>
      <figcaption>NHN Coding Convention</figcaption>
    </figure>

    <!-- 이미지 -->
    <figure>
      <object width="300" height="300" data="/src/assets/face/face1.jpg"></object>
      <figcaption>이미지 파일</figcaption>
    </figure>
  </body>
</html>
