<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>폼과 인풋요소 | Likelion Bootcamp</title>
  </head>
  <body>
    <a href="/index.html">Index로 이동</a>
    <hr />
    <h1>폼과 인풋요소</h1>

    <form action="#none" method="post">
      <fieldset>
        <legend>필수 입력</legend>
        <div>
          <label for="userName">이름</label>
          <input type="text" name="userName" id="userName" required />
        </div>
        <div>
          <label for="userPassword">비밀번호</label>
          <input type="password" name="userPassword" id="userPassword" required />
        </div>
        <div>
          <label for="search">검색</label>
          <input type="text" name="search" id="search" required />
        </div>
        <div>
          <label for="userEmail">이메일</label>
          <input type="email" name="userEmail" id="userEmail" required />
        </div>
      </fieldset>
    </form>
    <hr />
    <form action="https://formspree.io/f/xeqwwbwk" method="post">
      <!-- 텍스트 입력 서식 -->
      <div>
        <label for="userID">ID</label>
        <input type="text" id="userID" placeholder="아이디 or 이메일" required />
      </div>
      <!-- 비밀번호 입력 서식 -->
      <div>
        <label for="userPW">비밀번호</label>
        <input type="password" id="userPW" placeholder="비밀번호는 최소 8자 이상 입력하세요." required pattern="^(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&]).{8,}$" />
      </div>
      <!-- 이메일 입력 서식 -->
      <div>
        <label for="userEM">이메일</label>
        <input type="email" id="userEM" placeholder="예시: guest@Likelion.com" required />
      </div>
      <!-- 전화번호 입력 서식 -->
      <div>
        <label for="userPH">전화번호</label>
        <input type="tel" id="userPH" placeholder="예시: 010-0000-0000" required pattern="[0-9]{10}" />
      </div>
      <!-- URL 입력 서식 -->
      <div>
        <label for="userSNS">SNS</label>
        <input type="url" id="userSNS" placeholder="예시: https://www.facebook.com/" />
      </div>

      <!-- 검색어 입력 서식 -->
      <div>
        <label for="search1">검색어 입력</label>
        <input type="search" name="search" id="search1" />
      </div>
      <!-- 검색어 입력 서식 -->
      <div>
        <label for="file">파일 선택</label>
        <input type="file" name="file" id="file" />
      </div>

      <!-- 라디오 입력 서식 -->
      <div>
        <input type="radio" id="mail" name="userGender" value="man" checked />
        <label for="mail">남자</label>
        <input type="radio" id="female" name="userGender" value="woman" />
        <label for="female">여자</label>
      </div>
      <!-- 체크박스 입력 서식 -->
      <div>
        <input type="checkbox" id="html" name="frontend" value="html" />
        <label for="html">html</label>
        <input type="checkbox" id="css" name="frontend" value="css" />
        <label for="css">css</label>
        <input type="checkbox" id="js" name="frontend" value="js" />
        <label for="js">javascript</label>
      </div>

      <input type="submit" value="전송" />
      <input type="reset" value="초기화" />
    </form>
  </body>
</html>
