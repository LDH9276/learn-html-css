<!doctype html>
<html lang="ko-KR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>
    <a href="/index.html">Index로 이동</a>
    <hr />
    <h1>이미지와 피규어</h1>
    <hr />

    <!-- 이미지 alt의 공란으로 적을 시 스크린 리더는 읽지 않고 넘어간다. (해당 이미지가 불필요한 정보일 경우.) -->
    <a href="#none">
      <p>
        브로슈어 <span>다운받기</span>
        <img src="/src/assets/cafew/brochure-@1x.png" alt="" />
      </p>
      <div class=""></div>
    </a>

    <!-- 이미지의 필요한 정보일 경우 alt 속성으로 넣는다. -->
    <h2>
      <img loading="lazy" width="600" height="400" src="/src/assets/korean-cuisine/sidedish10.jpg" alt="천사채 위에 올라온 왼쪽부터 광어회, 농어회, 옥돔회" />
    </h2>

    <!-- figure요소 -->
    <figure>
      <img width="50" height="50" src="/src/assets/svg/chitchat.svg" alt="chitchat" />
      <figcaption>
        <p>사진</p>
      </figcaption>
    </figure>

    <!-- svg 코드 -->
    <svg width="50" height="50" class="h-12 w-12" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="a">
          <stop stop-color="#2397B3" offset="0%"></stop>
          <stop stop-color="#13577E" offset="100%"></stop>
        </linearGradient>
        <linearGradient x1="50%" y1="0%" x2="50%" y2="100%" id="b">
          <stop stop-color="#73DFF2" offset="0%"></stop>
          <stop stop-color="#47B1EB" offset="100%"></stop>
        </linearGradient>
      </defs>
      <g fill="none" fill-rule="evenodd">
        <path
          d="M28.872 22.096c.084.622.128 1.258.128 1.904 0 7.732-6.268 14-14 14-2.176 0-4.236-.496-6.073-1.382l-6.022 2.007c-1.564.521-3.051-.966-2.53-2.53l2.007-6.022A13.944 13.944 0 0 1 1 24c0-7.331 5.635-13.346 12.81-13.95A9.967 9.967 0 0 0 13 14c0 5.523 4.477 10 10 10a9.955 9.955 0 0 0 5.872-1.904z"
          fill="url(#a)"
          transform="translate(1 1)"
        ></path>
        <path d="M35.618 20.073l2.007 6.022c.521 1.564-.966 3.051-2.53 2.53l-6.022-2.007A13.944 13.944 0 0 1 23 28c-7.732 0-14-6.268-14-14S15.268 0 23 0s14 6.268 14 14c0 2.176-.496 4.236-1.382 6.073z" fill="url(#b)" transform="translate(1 1)"></path>
        <path d="M18 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM24 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM30 17a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" fill="#FFF"></path>
      </g>
    </svg>
